name: CI

# Deliberately credential-free: no OIDC, no secrets, no `permissions` beyond
# reading the checkout. That is what makes it safe to run on pull requests from
# forks, and it is why the Terraform job initialises with -backend=false rather
# than reaching for state.
#
# Pull requests are the gate. The push trigger is main only, and is not a
# second gate — by then the merge has happened. It is there because Actions
# caches are readable from the current branch, the base branch, or the DEFAULT
# branch, and nothing else: a cache written on a feature branch is invisible to
# every other feature branch. Runs on main are what populate the layer cache
# that pull requests into either branch restore from.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

# A superseded run tells you nothing, and PR pushes come in bursts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Matches the media consumer's Dockerfile. Pinned rather than left to the
  # runner: a version that passes here and is not what the image runs is a
  # green check about the wrong interpreter.
  PYTHON_VERSION: '3.13'
  TERRAFORM_VERSION: '1.15.8'

jobs:
  # Path filtering lives here rather than in workflow-level `paths:`. A required
  # status check skipped by a workflow-level filter never reports at all, and
  # the pull request waits on it forever. Job-level conditions plus the `gate`
  # job at the bottom give the same savings with an answer that always arrives.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # NOT 'apps/**'. apps/workers is Python, and matching it here
            # would run lint, typecheck and unit tests that have nothing to say
            # about a Python change — and report success. A check that always
            # answers, but answers about the wrong thing, is worse than one
            # that is missing.
            node:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              # The generated contracts are an output of packages/shared, so a
              # hand-edit here has to face the drift check in the quality job.
              - 'apps/workers/media-consumer/contracts/**'
              # The quality job runs `npm run audit`, which is this script. It
              # belongs here rather than only under `workflows` because this is
              # where it is actually EXECUTED — shellcheck reads it, this runs it.
              - '.github/scripts/audit-gate.sh'
              - '.github/workflows/ci.yml'
            # The whole worker tree. It is single-language by design (ADR 11
            # plus ADR 19's deletions), which is what lets this be one path
            # rather than a list of directories that has to be maintained.
            python:
              - 'apps/workers/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
            # Narrower than `node` on purpose. The quality job already runs
            # `turbo run build`, which covers `next build` and `nest build`, so
            # ordinary source changes cannot break the image without breaking
            # that first. What this catches is the class the quality job cannot
            # see: Dockerfile edits, and dependency changes that shift what has
            # to be copied between stages or pruned out of the runtime tree.
            docker:
              - 'apps/**/Dockerfile'
              - '.dockerignore'
              - 'package-lock.json'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              # The Python equivalent of the package.json entries above: what
              # gets installed into the consumer image.
              - 'apps/workers/*/pyproject.toml'
              # The smoke test itself. Without this a change to the script runs
              # no image job, so the check would be edited without ever being
              # exercised. The other scripts under .github/scripts are covered
              # by the `workflows` filter below.
              - '.github/scripts/smoke-image.sh'
              - '.github/workflows/ci.yml'
            # Every workflow, not just ci.yml. The deploy workflows were
            # previously matched by no filter at all, so a pull request
            # changing only one of them ran zero jobs and still reported
            # "All checks passed".
            # Every workflow, and the scripts they call. Those scripts matched
            # no filter at all, so a pull request changing only one of them ran
            # zero jobs and still reported "All checks passed" — the same hole
            # this filter was widened to close for the deploy workflows.
            # scan-gate.sh in particular runs only inside a deploy, so CI cannot
            # execute it and shellcheck is the whole of its coverage.
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/**'

  quality:
    name: Lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` runs @nahuat/database's postinstall (prisma generate), which
      # the typecheck and test steps both need — the generated client is not
      # committed.
      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # CRITICAL for now, and knowingly weaker than it should be.
      #
      # `--audit-level=high` fails today and cannot be made to pass: three high
      # advisories all resolve to deepmerge-ts reached through @prisma/config,
      # and the only remedy npm offers is prisma@6.12.0 — a downgrade off the
      # 7.x line. A blocking check that cannot go green teaches people to
      # ignore it, so the threshold sits at critical until the advisory can be
      # excepted deliberately rather than by lowering the bar for everything.
      #
      # ⚠️ This accepts every future HIGH advisory too, including fixable ones
      # in the request path. Tracked; the target is an allowlist with per-entry
      # expiry, before launch.
      - name: Audit dependencies
        run: npm run audit

      # turbo resolves ^build first: api's tests import @nahuat/database
      # through its "main" entry, which points at dist/.
      - name: Unit tests
        run: npm test

      # The check that makes the generated contracts trustworthy. Without it
      # they are a snapshot that looks authoritative while drifting from the
      # Zod source they claim to mirror — which is worse than a hand-written
      # file, because nobody thinks to distrust generated output.
      - name: Contracts match their Zod source
        run: |
          npm run generate:contracts --workspace=@nahuat/shared
          if ! git diff --quiet -- apps/workers/media-consumer/contracts; then
            echo "::error::Generated contracts are stale. Run: npm run generate:contracts --workspace=@nahuat/shared"
            git --no-pager diff -- apps/workers/media-consumer/contracts
            exit 1
          fi

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # Its own compose project (`name: nawat-test` in the file), on ports that
      # do not collide with the development stack or with db-tunnel.sh's
      # forwarded port. The suite refuses to run against any database not named
      # nahuat_test, so a mis-wired service fails loudly rather than truncating
      # something real.
      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      # Applies the migration FILES, the same way a deployed environment does,
      # so the hand-written ones are exercised — the accent-insensitive GIN
      # indexes and the immutable_unaccent search_path fix are invisible to a
      # schema push.
      - name: Integration tests
        run: npm run test:integration

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # The consumer is the only Python here, and it is a Lambda rather than a
  # service, so nothing else in CI would have exercised it. Pinned to the
  # image's interpreter rather than the runner's default: a version that
  # passes here and is absent from the image is a green check that proves
  # nothing about what ships.
  python:
    name: Lint and test Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workers/media-consumer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/workers/media-consumer/pyproject.toml

      # The consumer shells out to ffmpeg and ffprobe, so without them the
      # tests that measure a real transcode can only skip — and a skipped
      # assertion looks identical to a passing one in a summary line. The
      # loudness defect fixed in the audio module was reachable only by running
      # ffmpeg, which meant it could not surface until a deploy.
      #
      # The runner image does not carry ffmpeg. apt is the whole cost.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Unit tests
        run: pytest

  terraform:
    name: Terraform validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Covers modules/ as well, which the root-module validation below reaches
      # only indirectly.
      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false skips S3 entirely: no credentials, no state read, no
      # lock. It still downloads providers, which is what validate needs to
      # check resource schemas.
      - name: Validate root modules
        run: |
          set -euo pipefail
          for dir in \
            infra/terraform/global \
            infra/terraform/environments/production/foundation \
            infra/terraform/environments/production/application \
            infra/terraform/environments/staging/foundation \
            infra/terraform/environments/staging/application
          do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Built and thrown away. The point is that a broken Dockerfile fails review
  # rather than a production deploy; pushing would require credentials this
  # workflow deliberately does not have.
  #
  # ARM to match the task definitions' cpu_architecture. A mismatch produces an
  # opaque exec format error at task start, so building x86 here would validate
  # the wrong thing.
  image:
    name: Build ${{ matrix.name }} image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # CONTEXT DIFFERS PER IMAGE, which is why this is an include list rather
      # than a bare list of names. api and web are built from the repository
      # root because they copy across workspaces; the media consumer is a
      # self-contained Python package and building it from the root would ship
      # the entire repository as its context for no benefit.
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: media-consumer
            context: apps/workers/media-consumer
            file: apps/workers/media-consumer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: false
          # Loaded into the local daemon so the next step can run it. A build
          # that is never started proves the Dockerfile parses and the compile
          # succeeds, and nothing about whether the artifact works.
          load: true
          tags: nahuat-${{ matrix.name }}:ci
          # Matches the deploy workflow. buildx otherwise emits an image index
          # whose children are pushed untagged, and the ECR lifecycle rule
          # expiring untagged images after a day would delete them out from
          # under the live tag. Harmless here since nothing is pushed, but the
          # two builds should not diverge.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # THE ONLY CHECK HERE THAT RUNS THE THING BEING SHIPPED. Everything else
      # in this workflow reads the repository, where module resolution and
      # configuration differ from the pruned image — see the script for the
      # defect that reached staging through a fully green pipeline.
      #
      # The runner is arm64 and the image is built for linux/arm64, so this
      # executes natively rather than under emulation.
      - name: Smoke test the image
        run: ./.github/scripts/smoke-image.sh "${{ matrix.name }}" "nahuat-${{ matrix.name }}:ci"

  # Catches what YAML validity cannot: `needs` naming a job that does not
  # exist, ${{ }} expressions referencing missing outputs or contexts
  # unavailable at that point, unknown action inputs, and — via the shellcheck
  # it embeds — bugs inside every `run:` block. The deploy workflows carry most
  # of the shell in this repo and none of it was checked by anything.
  #
  # Credential-free like the rest of CI: actionlint only reads files.
  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than tracking latest: a linter that changes rules on its
      # own schedule turns an unrelated pull request red for reasons its author
      # did not introduce.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      # actionlint shellchecks the `run:` blocks inside workflows and has
      # nothing to say about a standalone .sh file, so matching the filter above
      # without this would run a job that reports on the wrong thing — which is
      # the failure mode the `node` filter's comment already warns about.
      # shellcheck is preinstalled on the runner.
      - name: Shellcheck the gate scripts
        run: shellcheck .github/scripts/*.sh

  # The one check to mark required in branch protection. It always runs, so it
  # always reports, whatever the filters above decided. `result` is used rather
  # than a plain `needs` dependency because a skipped job would otherwise be
  # treated as success by `needs` alone — and here a skip genuinely is success,
  # while a failure or cancellation is not.
  gate:
    name: All checks passed
    needs: [quality, integration, python, terraform, image, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "quality=${{ needs.quality.result }}" \
            "integration=${{ needs.integration.result }}" \
            "python=${{ needs.python.result }}" \
            "terraform=${{ needs.terraform.result }}" \
            "image=${{ needs.image.result }}" \
            "workflows=${{ needs.workflows.result }}"
          do
            name="${result%%=*}"
            status="${result#*=}"
            case "$status" in
              success|skipped) echo "ok       $name ($status)" ;;
              *)               echo "FAILED   $name ($status)"; failed=1 ;;
            esac
          done
          exit "$failed"

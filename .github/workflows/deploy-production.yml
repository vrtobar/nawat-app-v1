name: Production

# Every merge to main deploys, subject to the production environment's
# required-reviewer gate. Automatic triggering with a human gate rather than
# manual dispatch: it makes main mean "what is live", and the approval is
# recorded against the run instead of living in whoever remembered to dispatch.
#
# workflow_dispatch is kept for redeploying without a new commit — recovering
# from a rolled-back service, or shipping an image that already exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Production is never torn down, so unlike staging there is no action input.
# The only thing this workflow does is move production onto the current commit.

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.15.8'
  TF_DIR: infra/terraform/environments/production/application

jobs:
  # Deliberately outside the production environment. Building an artifact is
  # not the act that needs approval — deploying it is — so images are ready by
  # the time a reviewer looks, and a build failure is visible without anyone
  # having to approve it first.
  images:
    name: Push ${{ matrix.app }}
    runs-on: ubuntu-24.04-arm
    strategy:
      # fail-fast: false — the three images are INDEPENDENT ARTIFACTS, and
      # cancelling the others buys nothing. On 2026-09-02 the consumer's scan
      # gate failed and took the api and web builds down with it, so the
      # release had a consumer image it could not deploy and no api image at
      # all — the one needed to replace a crash-looping service. A failing
      # image still fails this job and still blocks the deploy; what changes
      # is that the images that were fine are on the registry afterwards.
      fail-fast: false
      # An include list because CONTEXT DIFFERS PER IMAGE. api and web build
      # from the repository root, since their Dockerfiles copy across
      # workspaces; the media consumer is a self-contained Python package and
      # building it from the root would hand Docker the whole repository to
      # gain nothing. `app` still names the ECR repository and the cache scope.
      matrix:
        include:
          - app: api
            context: .
            file: apps/api/Dockerfile
          - app: web
            context: .
            file: apps/web/Dockerfile
          - app: media-consumer
            context: apps/workers/media-consumer
            file: apps/workers/media-consumer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # No `environment:` key. Naming an environment changes the OIDC subject
      # claim to repo:<repo>:environment:<name>, which would stop matching the
      # build role's ref-based trust. The build role trusts refs/heads/main and
      # refs/heads/develop precisely so this job works on both.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # ⚠️ ECR TAGS ARE IMMUTABLE (docs/adr/0002), so pushing a tag that already
      # exists is rejected outright — which makes rebuilding an unchanged commit
      # a hard failure rather than a no-op.
      #
      # This workflow triggers on push, so the sha usually differs and the
      # collision usually cannot happen. RE-RUNNING IS THE EXCEPTION, and it is
      # the remedy for exactly the situations where re-running is what you
      # reach for: a transient registry or network failure, or a check suite
      # that never fired because GitHub dropped the event during an outage and
      # does not replay it. Under the old behaviour the second attempt failed
      # differently from the first, on a message about tag immutability that
      # says nothing about the original problem.
      #
      # Found on staging 2026-08-28, where `down` then `up` on an unchanged
      # commit could never succeed. Fixed in both workflows rather than only
      # the one that surfaced it.
      #
      # Skipping the build is not a workaround for immutability, it is what
      # immutability is FOR: one commit, one image, built once and reused. A
      # rebuild would be wasted work even where the registry allowed it.
      #
      # batch-get-image rather than describe-images because the build role is
      # granted ecr:BatchGetImage and not ecr:DescribeImages — see the global
      # layer. Checking with an API the role cannot call would turn every run
      # into a permissions failure.
      - name: Already built?
        id: existing
        run: |
          count=$(aws ecr batch-get-image \
            --repository-name nahuat-${{ matrix.app }} \
            --image-ids imageTag=prod-${{ github.sha }} \
            --query 'length(images)' --output text 2>/dev/null || echo 0)
          if [ "$count" = "0" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No image for prod-${{ github.sha }} — building."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "prod-${{ github.sha }} already in ECR — reusing it."
          fi

      - name: Build and push
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/nahuat-${{ matrix.app }}:prod-${{ github.sha }}
          # Without these, buildx pushes an image index whose children are
          # untagged, and the ECR lifecycle rule expiring untagged images after
          # one day deletes them out from under the live tag — pulls start
          # failing about 24 hours after a deploy with no code change to blame.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=production-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.app }}

      # The registry has scanned on push since it was created, and until this
      # step nothing ever read the result — a critical finding sat in the
      # console where no one looked. This is the read.
      #
      # The threshold, the accepted-findings policy and the reasons for both
      # live in the script and in .github/image-cve-allowlist.json. They are
      # not restated here: the same gate runs in the staging workflow, and a
      # policy explained in three places is one that will disagree with
      # itself.
      - name: Scan gate
        run: ./.github/scripts/scan-gate.sh nahuat-${{ matrix.app }} prod-${{ github.sha }}

  # ONE job, where staging uses four.
  #
  # Two reasons. AWS_PRODUCTION_ROLE_ARN is scoped to the production
  # environment, so every job that touches AWS has to declare
  # `environment: production` — and each such job independently requests
  # approval. Four jobs would mean a reviewer approving the same deploy
  # repeatedly, with the run half-applied between clicks.
  #
  # It also matches what a production deploy is: migrate, roll, verify is one
  # operation that either completes or needs looking at. Staging splits them
  # because staging has no gate and the granularity is free there.
  deploy:
    name: Deploy to production
    needs: images
    environment: production
    runs-on: ubuntu-latest
    steps:
      # Full history: the consumer check below diffs this commit against the
      # commit the running Lambda image was built from, which is an arbitrary
      # earlier point and unreachable in the default shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Read-only. This role holds s3:GetObject on production/* and no
      # PutObject, so it cannot write state or take a lock even by accident.
      # Production infrastructure changes are applied by a human; CI only
      # promotes artifacts onto what already exists.
      - name: Init
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Read outputs
        id: out
        run: |
          set -euo pipefail
          get() { terraform -chdir="$TF_DIR" output -raw "$1"; }
          {
            echo "cluster=$(get ecs_cluster_name)"
            echo "security_group=$(get ecs_api_sg_id)"
            echo "migrate_family=$(get migrate_task_family)"
            echo "api_family=$(get api_task_family)"
            echo "web_family=$(get web_task_family)"
            echo "api_service=$(get api_service_name)"
            echo "web_service=$(get web_service_name)"
            echo "subnets=$(terraform -chdir="$TF_DIR" output -json ecs_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      # The migration task has no service, so nothing keeps its revision
      # current. Its own revision is registered here with the image being
      # deployed and THAT revision is run by ARN — running the family name
      # would migrate using whatever image Terraform last wrote, which is the
      # previous release.
      - name: Register migration revision
        id: register_migrate
        env:
          FAMILY: ${{ steps.out.outputs.migrate_family }}
          IMAGE: ${{ vars.ECR_REGISTRY }}/nahuat-api:prod-${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > base.json

          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' base.json > next.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      # Before services roll, so a failed migration stops the deploy rather
      # than leaving new code against an old schema.
      - name: Run migrations
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          TASK_DEF: ${{ steps.register_migrate.outputs.arn }}
          SUBNETS: ${{ steps.out.outputs.subnets }}
          SG: ${{ steps.out.outputs.security_group }}
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          # A task that never starts reports exitCode null, so anything other
          # than an explicit 0 is a failure — defaulting to pass here would let
          # a broken migration through silently.
          read -r exit_code reason < <(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].[exitCode,reason]' --output text)

          echo "exitCode=$exit_code reason=$reason"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration task did not exit cleanly. Check /ecs/nahuat-production/migrate."
            exit 1
          fi

      # Reference data (the dialect rows) after migrations, before services
      # roll. Reuses the revision registered above — same prod-{sha} image — with
      # the command overridden to db:seed. Every Translation.dialectCode is an FK
      # with onDelete: Restrict, so without these rows no translation can be
      # written at all; this is what makes content authorable in production.
      #
      # Safe on every deploy: db:seed loads reference data only and upserts on
      # each row's natural key, so re-running converges rather than duplicating.
      # db:seed:dev, which loads placeholder content, is a different command and
      # is never reachable from here.
      - name: Run reference seed
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          TASK_DEF: ${{ steps.register_migrate.outputs.arn }}
          SUBNETS: ${{ steps.out.outputs.subnets }}
          SG: ${{ steps.out.outputs.security_group }}
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["npm","run","db:seed","--workspace=@nahuat/database"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          # Same as the migration step: exitCode null means the task never
          # started, so only an explicit 0 counts as success.
          read -r exit_code reason < <(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].[exitCode,reason]' --output text)

          echo "exitCode=$exit_code reason=$reason"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Reference seed task did not exit cleanly. Check /ecs/nahuat-production/migrate."
            exit 1
          fi

      # Terraform owns the task definition shape; this copies its newest
      # revision and substitutes only the image, so Terraform's environment,
      # secret and sizing changes still reach production by way of the revision
      # being copied.
      #
      # Both services are rolled before either is waited on, so the two
      # rollouts overlap instead of running back to back.
      - name: Roll services
        id: roll
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          API_FAMILY: ${{ steps.out.outputs.api_family }}
          WEB_FAMILY: ${{ steps.out.outputs.web_family }}
          API_SERVICE: ${{ steps.out.outputs.api_service }}
          WEB_SERVICE: ${{ steps.out.outputs.web_service }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          roll() {
            local app="$1" family="$2" service="$3"
            aws ecs describe-task-definition --task-definition "$family" \
              --query taskDefinition > "base-$app.json"

            jq --arg image "$REGISTRY/nahuat-$app:prod-$SHA" '
              .containerDefinitions[0].image = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' "base-$app.json" > "next-$app.json"

            local arn
            arn=$(aws ecs register-task-definition --cli-input-json "file://next-$app.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)

            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --task-definition "$arn" >/dev/null
            echo "$service -> $arn"
          }

          roll api "$API_FAMILY" "$API_SERVICE"
          roll web "$WEB_FAMILY" "$WEB_SERVICE"

      # services-stable gives up after ~10 minutes, which is longer than a
      # healthy rollout and shorter than waiting on one that will never
      # converge.
      - name: Wait for both services
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          API: ${{ steps.out.outputs.api_service }}
          WEB: ${{ steps.out.outputs.web_service }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API" "$WEB"
          echo "Both services stable."

      # STABLE IS NOT THE SAME AS DEPLOYED. When a task will not start, ECS's
      # circuit breaker rolls the service back to the previous task definition,
      # and the rollback reaches a steady state — so `wait services-stable`
      # returns 0 and the step above passes. Staging demonstrated this on
      # 2026-09-04: a green run for a commit whose image exited on boot, with
      # both services still serving the previous release.
      #
      # Readiness below would not catch it either. The old image is a working
      # API, so /api/health/ready answers 200 — it proves something is serving,
      # not that this release is.
      - name: Verify the running image is the one deployed
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          API: ${{ steps.out.outputs.api_service }}
          WEB: ${{ steps.out.outputs.web_service }}
          EXPECTED_TAG: prod-${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for svc in "$API" "$WEB"; do
            td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
                  --query 'services[0].taskDefinition' --output text)
            image=$(aws ecs describe-task-definition --task-definition "$td" \
                     --query 'taskDefinition.containerDefinitions[0].image' --output text)
            running_tag=${image##*:}
            if [ "$running_tag" = "$EXPECTED_TAG" ]; then
              printf '%-28s %s\n' "$svc" "$running_tag"
            else
              printf '::error::%s is running %s, expected %s — the deployment was rolled back\n' \
                "$svc" "$running_tag" "$EXPECTED_TAG"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Both services are running ${EXPECTED_TAG}."

      # THE MEDIA CONSUMER IS THE ONE THING A PRODUCTION RELEASE CANNOT SHIP BY
      # ITSELF. This workflow never applies Terraform — the role is read-only on
      # state by design — and the function's image is set only by
      # modules/messaging. So a release that changes the consumer needs a human
      # apply, and nothing here noticed when one did not happen.
      #
      # Staging hit exactly this on 2026-09-05 for a different reason (its apply
      # was gated on `up`): the API and web tier moved, the consumer did not,
      # and the release's new derivative field met the old consumer's output.
      # The approval gate then correctly refused to build a partial ladder and
      # the page rendered as though the feature had never shipped. Nothing
      # errored. On production there is no equivalent of staging's fix — the
      # apply cannot be added here — so this check is the whole guard.
      #
      # ⚠️ IT IS DELIBERATELY CONDITIONAL, and that is the point. Unlike the ECS
      # services, the Lambda's tag is EXPECTED to lag: it changes only when a
      # human applies, so every release that leaves apps/workers/ alone
      # legitimately runs an older image. Asserting the tag unconditionally
      # would fail almost every release, and a check that cries wolf is worse
      # than no check — it gets skipped, and then it is not there on the day it
      # matters. So the tag is compared only as a shortcut, and the real
      # question is whether the code inside the image differs.
      #
      # Scope is apps/workers/ alone: that is what determines the image's
      # contents. A Terraform layer lagging the code more generally is a
      # broader problem with its own backlog entry, not this step's job.
      - name: Verify the media consumer image is current
        env:
          EXPECTED_TAG: prod-${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for fn in nahuat-production-media-consumer nahuat-production-media-reaper; do
            image=$(aws lambda get-function --function-name "$fn" \
                     --query 'Code.ImageUri' --output text)
            running_tag=${image##*:}

            if [ "$running_tag" = "$EXPECTED_TAG" ]; then
              printf '%-38s %s (current)\n' "$fn" "$running_tag"
              continue
            fi

            # An older tag is only a problem if what it was built from differs.
            running_sha=${running_tag#prod-}
            if ! git cat-file -e "${running_sha}^{commit}" 2>/dev/null; then
              printf '::error::%s is running %s, a commit not in this history — cannot tell whether it is current\n' \
                "$fn" "$running_tag"
              failed=1
              continue
            fi

            if git diff --quiet "$running_sha" "$GITHUB_SHA" -- apps/workers/; then
              printf '%-38s %s (older, identical consumer)\n' "$fn" "$running_tag"
            else
              printf '::error::%s is running %s but apps/workers/ changed since then — apply Terraform against production to update it, then re-run this deploy\n' \
                "$fn" "$running_tag"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "The consumer image matches this release."

      # services-stable used to prove database connectivity as a side effect:
      # the ALB health check ran the Prisma indicator, so no task reached steady
      # state without it. That check is liveness only now, so the property has
      # to be asserted here or a release goes green with the API unable to reach
      # Postgres.
      #
      # This is a smoke check, not the old guarantee: one request through
      # CloudFront reaches one task, where the ALB probed every task. It still
      # catches what actually goes wrong — a bad secret or the wrong security
      # group on the new task definition, which is uniform across tasks.
      #
      # No ordering trap: the image being verified was built from this same
      # commit, so /api/health/ready exists in it whenever this step exists.
      - name: Verify readiness
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 20 \
              https://api.nahuat.com/api/health/ready || echo 000)
            if [ "$code" = "200" ]; then
              echo "readiness ok"
              cat /tmp/ready.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          echo "::error::readiness check failed after 5 attempts"
          cat /tmp/ready.json 2>/dev/null || true
          exit 1

      # Without this the failure above is just a timeout, and the actual reason
      # lives in the console. Task placement failures in particular (secrets,
      # image pull, subnet capacity) never reach the container log group,
      # because no container ever started.
      - name: Diagnose
        if: failure()
        env:
          CLUSTER: ${{ steps.out.outputs.cluster }}
          API: ${{ steps.out.outputs.api_service }}
          WEB: ${{ steps.out.outputs.web_service }}
        run: |
          for svc in "$API" "$WEB"; do
            echo "::group::$svc"
            aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].{running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' \
              --output table
            echo "recent events:"
            aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].events[:5].message' --output text | tr '\t' '\n'
            echo "stopped tasks:"
            for t in $(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$svc" \
                        --desired-status STOPPED --query 'taskArns[:2]' --output text); do
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$t" \
                --query 'tasks[0].stoppedReason' --output text
            done
            echo "::endgroup::"
          done

  summary:
    name: Summary
    needs: [images, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "### Production deploy"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Images | ${{ needs.images.result }} |"
            echo "| Deploy | ${{ needs.deploy.result }} |"
            echo
            echo "Tag \`prod-${{ github.sha }}\` — https://nahuat.com"
          } >> "$GITHUB_STEP_SUMMARY"

name: Staging

# Manual only. Staging is stood up to exercise something and torn down again,
# so there is no push trigger — an automatic staging deploy would mean paying
# for an environment nobody is looking at.
#
# MUST be dispatched from the `develop` ref. The staging role's trust policy
# names repo:<repo>:ref:refs/heads/develop and nothing else, so a dispatch from
# any other branch fails at AssumeRoleWithWebIdentity rather than at anything
# that explains itself.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - up # build, apply infrastructure, migrate
          - deploy # build, migrate, update the lambdas, roll services onto new code
          - seed # load dev sample data (db:seed:dev) into a running environment
          - down # destroy the application layer
        default: deploy

# Never two at once, and never cancelled mid-flight: a half-applied Terraform
# run leaves state and reality disagreeing, which is worse than queueing.
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.15.8'
  TF_DIR: infra/terraform/environments/staging/application

jobs:
  # Skipped on `down` — a teardown needs no artifact, and building one would
  # add three minutes to it. Also skipped on `seed`, which loads data into the
  # image already running and builds nothing.
  images:
    name: Push ${{ matrix.app }}
    if: inputs.action != 'down' && inputs.action != 'seed'
    runs-on: ubuntu-24.04-arm
    strategy:
      # fail-fast: false — the three images are INDEPENDENT ARTIFACTS, and
      # cancelling the others buys nothing. On 2026-09-02 the consumer's scan
      # gate failed and took the api and web builds down with it, so the
      # release had a consumer image it could not deploy and no api image at
      # all — the one needed to replace a crash-looping service. A failing
      # image still fails this job and still blocks the deploy; what changes
      # is that the images that were fine are on the registry afterwards.
      fail-fast: false
      # An include list because CONTEXT DIFFERS PER IMAGE. api and web build
      # from the repository root, since their Dockerfiles copy across
      # workspaces; the media consumer is a self-contained Python package and
      # building it from the root would hand Docker the whole repository to
      # gain nothing. `app` still names the ECR repository and the cache scope.
      matrix:
        include:
          - app: api
            context: .
            file: apps/api/Dockerfile
          - app: web
            context: .
            file: apps/web/Dockerfile
          - app: media-consumer
            context: apps/workers/media-consumer
            file: apps/workers/media-consumer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # No `environment:` key on this job. Naming an environment changes the
      # OIDC subject claim to repo:<repo>:environment:<name>, which would stop
      # matching the build role's ref-based trust condition.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # ⚠️ ECR TAGS ARE IMMUTABLE (docs/adr/0002), so pushing a tag that already
      # exists is rejected outright — which makes rebuilding an unchanged commit
      # a hard failure rather than a no-op. `down` then `up` on the same commit
      # could never succeed, and that is exactly the shape of "bring the
      # environment back to look at something I have not changed".
      #
      # Latent since immutable tags landed, and masked whenever the branch is
      # moving: a new commit means a new tag means no collision. It surfaced on
      # 2026-08-28, with development happening on a feature branch and the base
      # branch sitting still.
      #
      # Skipping the build is not a workaround for immutability, it is what
      # immutability is FOR: one commit, one image, built once and reused. A
      # rebuild would be wasted work even where the registry allowed it.
      #
      # batch-get-image rather than describe-images because the build role is
      # granted ecr:BatchGetImage and not ecr:DescribeImages — see the global
      # layer. Checking with an API the role cannot call would turn every run
      # into a permissions failure.
      - name: Already built?
        id: existing
        run: |
          count=$(aws ecr batch-get-image \
            --repository-name nahuat-${{ matrix.app }} \
            --image-ids imageTag=staging-${{ github.sha }} \
            --query 'length(images)' --output text 2>/dev/null || echo 0)
          if [ "$count" = "0" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No image for staging-${{ github.sha }} — building."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "staging-${{ github.sha }} already in ECR — reusing it."
          fi

      - name: Build and push
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/nahuat-${{ matrix.app }}:staging-${{ github.sha }}
          # Without these, buildx pushes an image index whose children are
          # untagged, and the ECR lifecycle rule expiring untagged images after
          # one day deletes them out from under the live tag — pulls start
          # failing about 24 hours after a deploy with no code change to blame.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=staging-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.app }}

      # THE SAME GATE THE PRODUCTION WORKFLOW APPLIES, and it is here because
      # it was not: staging built and ran the media consumer image all evening
      # while the first scan of it happened at the production boundary, which
      # failed the release. An image whose first inspection is the deploy that
      # needs it has been checked at the most expensive possible moment.
      #
      # NO `if:` CONDITION, deliberately — unlike the build above. A reused
      # image still has to pass; gating this on `found == 'false'` would let
      # anything already in ECR through unexamined, which is precisely the
      # image most likely to predate a newly published CVE. The wait inside
      # the script returns immediately for an image scanned on an earlier run.
      - name: Scan gate
        run: ./.github/scripts/scan-gate.sh nahuat-${{ matrix.app }} staging-${{ github.sha }}

  infra:
    name: Terraform ${{ inputs.action }}
    needs: images
    if: always() && (inputs.action == 'down' || inputs.action == 'seed' || needs.images.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      cluster: ${{ steps.out.outputs.cluster }}
      subnets: ${{ steps.out.outputs.subnets }}
      security_group: ${{ steps.out.outputs.security_group }}
      migrate_family: ${{ steps.out.outputs.migrate_family }}
      api_family: ${{ steps.out.outputs.api_family }}
      web_family: ${{ steps.out.outputs.web_family }}
      api_service: ${{ steps.out.outputs.api_service }}
      web_service: ${{ steps.out.outputs.web_service }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir="$TF_DIR" init -input=false

      # image_tag has no default and is not in terraform.tfvars, so it must be
      # passed. Deliberate: staging is created and destroyed by this workflow,
      # and a default would let an apply quietly deploy an image nobody chose.
      - name: Apply
        if: inputs.action == 'up'
        run: |
          terraform -chdir="$TF_DIR" apply -auto-approve -input=false \
            -var "image_tag=staging-${GITHUB_SHA}"

      # THE LAMBDAS ARE THE ONLY COMPUTE A DEPLOY CANNOT ROLL. The ECS services
      # get new task definitions registered and rolled by the deploy job below,
      # and they carry ignore_changes = [task_definition] precisely so Terraform
      # stays out of that. Nothing does the equivalent for the media consumer
      # and reaper: their image is set once, by modules/messaging, as
      # "${ecr_media_consumer_url}:${image_tag}". So without this step a deploy
      # moves the API and the web tier and leaves both functions on whatever the
      # last `up` installed.
      #
      # That happened on 2026-09-05. Deploying ea1d0cb moved api and web and
      # left both Lambdas on a0e9436, with every job green — this job included,
      # because Init and Read outputs both succeed while Apply is skipped. The
      # release added a field to the image derivatives, so the new API met the
      # old consumer's output and produced entries the page rendered as if the
      # feature had never shipped. Nothing errored.
      #
      # ⚠️ -target IS A WORKAROUND, NOT A PREFERENCE, and it should be deleted
      # rather than kept. A full apply against a running layer plans
      # `3 to add, 0 to change, 3 to destroy` — the ECS task definitions read as
      # drift over structural container fields (hostPort, systemControls,
      # volumesFrom) and force replacement. Measured on staging 2026-09-05 and
      # on production 2026-08-22; BACKLOG carries it as "ECS task-definition
      # resources drift, so a full apply against live infra plans destroys".
      # When that is fixed and a full apply plans 0 to destroy, drop the
      # -target and let this run against the whole layer.
      #
      # Scoped to module.messaging rather than the two function resources: the
      # module is the boundary that owns them, so a resource added to it later
      # is covered without anyone remembering to widen a list here.
      - name: Update the Lambdas
        if: inputs.action == 'deploy'
        run: |
          terraform -chdir="$TF_DIR" apply -auto-approve -input=false \
            -target=module.messaging \
            -var "image_tag=staging-${GITHUB_SHA}"

      # The tag is irrelevant to a destroy but the variable is still required,
      # so it is passed a well-formed placeholder rather than made optional —
      # optional here would weaken the guarantee on apply.
      - name: Destroy
        if: inputs.action == 'down'
        run: |
          terraform -chdir="$TF_DIR" destroy -auto-approve -input=false \
            -var "image_tag=staging-0000000000000000000000000000000000000000"

      - name: Read outputs
        id: out
        if: inputs.action != 'down'
        run: |
          set -euo pipefail
          get() { terraform -chdir="$TF_DIR" output -raw "$1"; }
          {
            echo "cluster=$(get ecs_cluster_name)"
            echo "security_group=$(get ecs_api_sg_id)"
            echo "migrate_family=$(get migrate_task_family)"
            echo "api_family=$(get api_task_family)"
            echo "web_family=$(get web_task_family)"
            echo "api_service=$(get api_service_name)"
            echo "web_service=$(get web_service_name)"
            echo "subnets=$(terraform -chdir="$TF_DIR" output -json ecs_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

  # Before services roll, so a failed migration stops the deploy rather than
  # leaving new code against an old schema.
  migrate:
    name: Run migrations
    needs: infra
    if: inputs.action == 'up' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The migration task has no service, so nothing keeps its revision
      # current. Its own revision is registered here with the image being
      # deployed and THAT revision is run by ARN — running the family name
      # would migrate using whatever image Terraform last wrote, which on a
      # `deploy` is the previous release.
      - name: Register migration revision
        id: register
        env:
          FAMILY: ${{ needs.infra.outputs.migrate_family }}
          IMAGE: ${{ vars.ECR_REGISTRY }}/nahuat-api:staging-${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > base.json

          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' base.json > next.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      - name: Run and wait
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          TASK_DEF: ${{ steps.register.outputs.arn }}
          SUBNETS: ${{ needs.infra.outputs.subnets }}
          SG: ${{ needs.infra.outputs.security_group }}
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          # A task that never starts reports exitCode null, so anything other
          # than an explicit 0 is a failure — defaulting to pass here would let
          # a broken migration through silently.
          read -r exit_code reason < <(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].[exitCode,reason]' --output text)

          echo "exitCode=$exit_code reason=$reason"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration task did not exit cleanly. Check /ecs/nahuat-staging/migrate."
            exit 1
          fi

  # Loads dev sample data into a running environment, on its own verb. Kept
  # separate from up/deploy because staging's data is disposable and reloaded
  # far more often than infrastructure changes — and, more importantly, because
  # db:seed:dev must never be reachable from the production workflow (this one
  # only ever assumes the develop-pinned staging role). Runs the migrate task
  # family's latest revision, which the last up/deploy registered with that
  # release's image — so the dev-entries.json being loaded is the one baked into
  # the code currently on staging — with the command overridden. seed.ts's
  # main() runs seedReference() before dev content regardless, so this also
  # (re)seeds the dialect rows the entries' translations reference.
  # always() is load-bearing, not defensive noise: on `seed` the images job is
  # skipped, and a downstream job with a plain `if` is skipped by propagation
  # when anything upstream in its needs chain skipped — even though infra itself
  # succeeds via its own always(). The explicit infra result check restores the
  # success() gate that naming an `if` otherwise removes. This is the same idiom
  # the verify job uses, and for the same reason.
  seed:
    name: Seed dev data
    needs: infra
    if: always() && inputs.action == 'seed' && needs.infra.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No revision registered here (unlike migrate): seed builds no image, so it
      # runs the family's latest ACTIVE revision as-is. The container name is
      # `migrate` — the seed reuses that task definition, only swapping argv.
      - name: Run and wait
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          FAMILY: ${{ needs.infra.outputs.migrate_family }}
          SUBNETS: ${{ needs.infra.outputs.subnets }}
          SG: ${{ needs.infra.outputs.security_group }}
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["npm","run","db:seed:dev","--workspace=@nahuat/database"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          # Same reasoning as the migrate task: exitCode is null for a task that
          # never started, so only an explicit 0 is a pass.
          read -r exit_code reason < <(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].[exitCode,reason]' --output text)

          echo "exitCode=$exit_code reason=$reason"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Seed task did not exit cleanly. Check /ecs/nahuat-staging/migrate."
            exit 1
          fi

  # Skipped on `up`: terraform apply just created the services pointing at the
  # image built in this run, so there is nothing to roll.
  deploy:
    name: Roll ${{ matrix.app }}
    needs: [infra, migrate]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform owns the task definition shape; this copies its newest
      # revision and substitutes only the image, so Terraform's environment,
      # secret and sizing changes still reach staging by way of the revision
      # being copied.
      - name: Register revision and update service
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          FAMILY: ${{ matrix.app == 'api' && needs.infra.outputs.api_family || needs.infra.outputs.web_family }}
          SERVICE: ${{ matrix.app == 'api' && needs.infra.outputs.api_service || needs.infra.outputs.web_service }}
          IMAGE: ${{ vars.ECR_REGISTRY }}/nahuat-${{ matrix.app }}:staging-${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > base.json

          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' base.json > next.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$arn" >/dev/null
          echo "$SERVICE -> $arn"

  # Runs for `up` as well as `deploy`, which is the point. Previously only the
  # deploy path waited, so `up` reported success the moment terraform apply
  # returned — and on 2026-08-14 that meant a green run while the web service
  # had zero running tasks and had been failing to place them for half an hour.
  # A stand-up that cannot tell you it did not stand up is worth little.
  verify:
    name: Verify services
    needs: [infra, migrate, deploy]
    if: always() && inputs.action != 'down' && needs.migrate.result == 'success' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # services-stable gives up after ~10 minutes, which is longer than a
      # healthy rollout and shorter than waiting on one that will never
      # converge.
      - name: Wait for both services
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          API: ${{ needs.infra.outputs.api_service }}
          WEB: ${{ needs.infra.outputs.web_service }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API" "$WEB"
          echo "Both services stable."

      # STABLE IS NOT THE SAME AS DEPLOYED, and the step above cannot tell the
      # difference. When a task will not start, ECS's circuit breaker rolls the
      # service back to the previous task definition — and that rollback then
      # reaches a steady state, so `wait services-stable` returns 0. On
      # 2026-09-04 that produced a green staging deploy of f1b0102 while both
      # services ran the b27e9cf image, because the new one exited on boot.
      # A deploy that reports success while the old code is serving is worse
      # than one that fails, because nothing afterwards questions it.
      #
      # So the running task definition's image is compared against the tag this
      # run built. This is the only check here that would notice a rollback.
      - name: Verify the running image is the one deployed
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          API: ${{ needs.infra.outputs.api_service }}
          WEB: ${{ needs.infra.outputs.web_service }}
          EXPECTED_TAG: staging-${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for svc in "$API" "$WEB"; do
            td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
                  --query 'services[0].taskDefinition' --output text)
            image=$(aws ecs describe-task-definition --task-definition "$td" \
                     --query 'taskDefinition.containerDefinitions[0].image' --output text)
            running_tag=${image##*:}
            if [ "$running_tag" = "$EXPECTED_TAG" ]; then
              printf '%-28s %s\n' "$svc" "$running_tag"
            else
              printf '::error::%s is running %s, expected %s — the deployment was rolled back\n' \
                "$svc" "$running_tag" "$EXPECTED_TAG"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Both services are running ${EXPECTED_TAG}."

      # THE SAME CHECK FOR THE COMPUTE THAT IS NOT AN ECS SERVICE. The step
      # above cannot see the Lambdas — it reads task definitions, and a function
      # has none — so a consumer left on an older image passes it untouched.
      # That is not hypothetical: on 2026-09-05 a deploy of ea1d0cb finished
      # green, this job included, with both functions still on a0e9436.
      #
      # It stays even though the step that installs them now runs on a deploy,
      # because the two answer different questions. That one makes the update
      # happen; this one establishes that it did — whether it was skipped, the
      # apply failed, or someone moved the image by hand.
      #
      # Names rather than Terraform outputs: the module builds them as
      # "${var.prefix}-media-consumer" and "${var.prefix}-media-reaper", and
      # this workflow already names its environment in TF_DIR and EXPECTED_TAG.
      # Adding outputs would mean a full apply before the workflow could read
      # them, which is the thing being worked around here.
      - name: Verify the Lambdas are running the image deployed
        env:
          EXPECTED_TAG: staging-${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for fn in nahuat-staging-media-consumer nahuat-staging-media-reaper; do
            image=$(aws lambda get-function --function-name "$fn" \
                     --query 'Code.ImageUri' --output text)
            running_tag=${image##*:}
            if [ "$running_tag" = "$EXPECTED_TAG" ]; then
              printf '%-34s %s\n' "$fn" "$running_tag"
            else
              printf '::error::%s is running %s, expected %s — the function was not updated\n' \
                "$fn" "$running_tag" "$EXPECTED_TAG"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Both functions are running ${EXPECTED_TAG}."

      # Production has done this since the health split; staging never has, so
      # a staging deploy of an API that could not reach its database reported
      # success. The ALB health check is liveness only and deliberately runs no
      # dependency check, so nothing else here would notice.
      #
      # It is worth more than it was: until the indicator behind this endpoint
      # started reading a table, it ran `SELECT 1` and answered 200 against a
      # database with no schema at all — so calling it from here would have
      # spread a signal that could not see the failure it exists to catch.
      #
      # A smoke check, not a guarantee: one request through CloudFront reaches
      # one task, where the ALB probes every task. It still catches what
      # actually goes wrong — a bad secret or the wrong security group on the
      # new task definition, which is uniform across tasks.
      - name: Verify readiness
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 20 \
              https://api.staging.nahuat.com/api/health/ready || echo 000)
            if [ "$code" = "200" ]; then
              echo "readiness ok"
              cat /tmp/ready.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          echo "::error::readiness check failed after 5 attempts"
          cat /tmp/ready.json 2>/dev/null || true
          exit 1

      # Without this the failure above is just a timeout, and the actual reason
      # lives in the console. Task placement failures in particular (secrets,
      # image pull, subnet capacity) never reach the container log group,
      # because no container ever started.
      - name: Diagnose
        if: failure()
        env:
          CLUSTER: ${{ needs.infra.outputs.cluster }}
          API: ${{ needs.infra.outputs.api_service }}
          WEB: ${{ needs.infra.outputs.web_service }}
        run: |
          for svc in "$API" "$WEB"; do
            echo "::group::$svc"
            aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].{running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' \
              --output table
            echo "recent events:"
            aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].events[:5].message' --output text | tr '\t' '\n'
            echo "stopped tasks:"
            for t in $(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$svc" \
                        --desired-status STOPPED --query 'taskArns[:2]' --output text); do
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$t" \
                --query 'tasks[0].stoppedReason' --output text
            done
            echo "::endgroup::"
          done

  summary:
    name: Summary
    needs: [images, infra, migrate, seed, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "### Staging: \`${{ inputs.action }}\`"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Images | ${{ needs.images.result }} |"
            echo "| Terraform | ${{ needs.infra.result }} |"
            echo "| Migrations | ${{ needs.migrate.result }} |"
            echo "| Seed | ${{ needs.seed.result }} |"
            echo "| Services | ${{ needs.deploy.result }} |"
            echo "| Verified | ${{ needs.verify.result }} |"
            echo
            if [ "${{ inputs.action }}" = "down" ]; then
              echo "Application layer destroyed. Foundation is untouched."
            elif [ "${{ inputs.action }}" = "seed" ]; then
              echo "Dev sample data loaded (\`db:seed:dev\`) — https://staging.nahuat.com/dictionary"
            else
              echo "Tag \`staging-${{ github.sha }}\` — https://staging.nahuat.com"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
